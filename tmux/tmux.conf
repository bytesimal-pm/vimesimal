# tmux config for vimesimal — linked to ~/.config/tmux/tmux.conf by install.sh

# --- Neovim inside tmux ------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-kitty:RGB,xterm-256color:RGB"   # true color
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'                # undercurl
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'  # underline color
set -sg escape-time 10          # no lag after <Esc>
set -g focus-events on          # lets Neovim notice file changes on focus
set -g mouse on
set -g mode-keys vi
set -g base-index 1
setw -g pane-base-index 1

# --- Ctrl-h/j/k/l: move between tmux panes and Neovim splits -----------------
# (vim-tmux-navigator; the Neovim side is lua/plugins/tmux.lua)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\\.?(view|l?n?vim?x?|fzf)(diff)?(-wrapped)?$'"
bind -n C-h if-shell "$is_vim" "send-keys C-h" "select-pane -L"
bind -n C-j if-shell "$is_vim" "send-keys C-j" "select-pane -D"
bind -n C-k if-shell "$is_vim" "send-keys C-k" "select-pane -U"
bind -n C-l if-shell "$is_vim" "send-keys C-l" "select-pane -R"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# Ctrl-l is taken, so clear the shell with <prefix> Ctrl-l
bind C-l send-keys C-l

# Split in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# --- Look: black/white like kitty, neon cyan accent like lualine's Normal mode
set -g status-style "bg=#1a1a1a,fg=#707070"
set -g status-left "#[bg=#00ffff,fg=#000000,bold] #S #[default] "
set -g status-right "#[fg=#707070]%H:%M "
setw -g window-status-format " #I #W "
setw -g window-status-current-format "#[bg=#3a3a3a,fg=#ffffff,bold] #I #W "
set -g pane-border-style "fg=#3a3a3a"
set -g pane-active-border-style "fg=#00ffff"
set -g message-style "bg=#1a1a1a,fg=#ffffff"
